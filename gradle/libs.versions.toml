[versions]
agp = "9.0.0"
kotlin = "2.2.10"
coreKtx = "1.15.0"
# Phase C: 1.9.3 cannot survive - navigation3-ui-android:1.1.0 and
# lifecycle-viewmodel-navigation3-android:2.10.0 both declare
# activity-compose:1.12.0 (POM + Gradle module metadata), so the 1.9.3
# request resolves to 1.12.0 anyway - verified with dependencyInsight while
# this pin was set to 1.9.3. Pinned explicitly (§8.2's "bump only if
# resolution forces" clause).
activityCompose = "1.12.0"
composeBom = "2026.01.01"
# ADR-42: Navigation 3 replaces the navigation-compose bridge (removed in C).
navigation3 = "1.1.0"
kotlinxSerializationJson = "1.8.1"
lifecycle = "2.10.0"
room = "2.7.1"
datastore = "1.1.7"
coroutines = "1.10.2"
work = "2.9.0"
# ADR-43: 2.57.2 (min version reading Kotlin 2.2 metadata) FAILED in Phase B —
# its Gradle plugin requires AGP's removed BaseExtension ("Android BaseExtension
# not found" under AGP 9). Pre-authorized fallback 2.60.1 applied.
hilt = "2.60.1"
androidxHilt = "1.2.0"
junit = "4.13.2"
espresso = "3.6.1"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
# Phase D (skill pin): Turbine replaces hand-rolled flow collection in the
# ViewModel suites it is adopted in - AGENTS.md §8 justification recorded.
turbine = "1.2.0"
# Phase F (skill pin): baseline-profile runtime. Ships the installer/reader and
# reads any assets/dexopt/baseline.prof packaged into the APK. TASK-012
# (ADR-45) generates that profile; the generation tooling versions are below.
profileInstaller = "1.4.1"
# ADR-45 / TASK-012: baseline profile GENERATION. Separate release train from
# profileinstaller (whose latest is still 1.4.1, so no coupling forces a change).
# androidx-baselineprofile is the Gradle plugin marker; it resolves to
# benchmark-baseline-profile-gradle-plugin and dispatches to the producer /
# consumer / apptarget sub-plugins. benchmark-macro-junit4 carries
# BaselineProfileRule; benchmark-junit4 is NOT transitive and is what supplies
# AndroidBenchmarkRunner. uiautomator is pinned to 2.3.0 - exactly the version
# benchmark-macro-junit4:1.5.0 requests - so the classic
# device.findObject(By...) DSL is used rather than the newer onElement {} DSL.
androidxBaselineProfile = "1.5.0"
androidxBenchmark = "1.5.0"
uiautomator = "2.3.0"
androidxTestExtJunit = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Navigation 3 (ADR-42): NavKey back stack + NavDisplay replace navigation-compose.
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Test-only. Justification: P0#1 requires a regression test through the real
# Room DAO (the REPLACE/cascade bug is invisible to fakes). Robolectric is the
# smallest way to run Room on JVM unit tests; it never ships in the app.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
# Test-only flow assertions for ViewModel suites (Phase D).
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# ADR-43: Hilt DI 2.60.1 (approved fallback — 2.57.2 fails under AGP 9 with
# "Android BaseExtension not found") + androidx.hilt integrations (1.2.0),
# KSP only.
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# Phase F: baseline-profile runtime (ADR-45) - reads whatever profile is packaged.
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
# ADR-45 / TASK-012: baseline profile generation. Consumed only by the
# :baselineprofile (com.android.test) module, never by the app.
androidx-benchmark-junit4 = { group = "androidx.benchmark", name = "benchmark-junit4", version.ref = "androidxBenchmark" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android (org.jetbrains.kotlin.android) intentionally absent: AGP 9
# built-in Kotlin owns the compilation — ADR-41. TOML cannot compose the KSP
# prefix from version.ref "kotlin", so the full KSP version stays inline.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# NavKey @Serializable routes (ADR-42).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.2.10-2.0.2" }
room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# ADR-45 / TASK-012. `android-test` is applied by the :baselineprofile module
# only (the app keeps android-application). `androidx-baselineprofile` is
# applied by BOTH: the producer module and the app as consumer / app-target.
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBaselineProfile" }

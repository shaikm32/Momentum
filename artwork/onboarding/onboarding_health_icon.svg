<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">

<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#74B7FF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#3F8CFF" stop-opacity="0.88"/>
    <stop offset="1" stop-color="#7B5CFF" stop-opacity="0.92"/>
  </linearGradient>
  <linearGradient id="cyanTile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#63E7E3" stop-opacity="0.92"/>
    <stop offset="1" stop-color="#2AB9D5" stop-opacity="0.9"/>
  </linearGradient>
  <radialGradient id="shine" cx="25%" cy="18%" r="85%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
    </feMerge>
  </filter>
</defs>


<rect x="6" y="6" width="84" height="84" rx="18" fill="url(#tile)"/>
<rect x="6.75" y="6.75" width="82.5" height="82.5" rx="17.25" stroke="#D9F2FF" stroke-opacity=".78" stroke-width="1.5"/>
<rect x="7" y="7" width="82" height="82" rx="17" fill="url(#shine)"/>
<path d="M48 17.5C42.1 28.8 29.8 39.8 29.8 53.1c0 11 8.1 19.7 18.2 19.7s18.2-8.7 18.2-19.7C66.2 39.8 53.9 28.8 48 17.5Z"
      fill="#fff" filter="url(#glow)"/>
<path d="M38.5 54.2c0 5.9 4.2 10.3 10.3 10.3" stroke="#79B7FF" stroke-width="3.2" stroke-linecap="round" opacity=".95"/>
<circle cx="57.5" cy="42.5" r="2.5" fill="#E9F7FF" opacity=".95"/>

</svg>

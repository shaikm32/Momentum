# TASK-011 Phase A: Robolectric SQLite mode for com.momentum.app.data.local.
#
# The default (NATIVE, set in app/build.gradle.kts for Windows hosts) enables
# Room 2.7.1's cross-thread connection pool but also makes schema validation
# after MIGRATION_1_2/2_3/3_4 truthful — which the hand-written v1 test fixture
# fails: its DDL omits index_completion_records_activityId and
# index_completion_records_occurrenceDate that schemas/<db>/1.json contains
# (pre-existing fixture gap; migrations themselves are correct for real v1
# installs). LEGACY is the baseline mode these tests passed under.
# Package-scoped here only; presentation.* tests require NATIVE (Room 2.7
# pool breaks LEGACY's per-thread connection tracking).
# Remove once the v1 fixture DDL is completed in a test-source change.
sqliteMode=LEGACY
